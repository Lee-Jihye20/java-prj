<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>評価ダッシュボード - 勤怠管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .evaluation-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .metric-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        .metric-value {
            font-size: 2em;
            font-weight: bold;
        }
        .trend-chart-container {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 8px;
        }
        .rating-comparison {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .rating-card {
            flex: 1;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        .rating-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 10px;
        }
        .rating-s { background-color: #ffeb3b; color: #333; }
        .rating-a { background-color: #ff9800; color: white; }
        .rating-b { background-color: #2196f3; color: white; }
        .rating-c { background-color: #9e9e9e; color: white; }
        .rating-d { background-color: #424242; color: white; }
        .difference-badge {
            background-color: #e74c3c;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>評価ダッシュボード</h1>
            <div class="user-info">
                <span th:text="${username}">ユーザー名</span>
                <a th:href="@{/employee/dashboard}" class="btn-secondary" style="margin-left: 10px;">ダッシュボードに戻る</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn-secondary" style="margin-left: 10px;">ログアウト</button>
                </form>
            </div>
        </header>

        <div th:if="${successMessage}" class="success-message">
            <p th:text="${successMessage}">処理が完了しました</p>
        </div>
        <div th:if="${errorMessage}" class="error-message">
            <p th:text="${errorMessage}">エラーが発生しました</p>
        </div>

        <div class="dashboard-content">
            <!-- 事実ベース評価 -->
            <section class="card">
                <h2>📊 事実ベース評価（<span th:text="${#temporals.format(currentMonth.atDay(1), 'yyyy年MM月')}"></span>）</h2>
                <div th:if="${factBasedEvaluation != null}">
                    <div class="evaluation-metrics">
                        <div class="metric-card">
                            <div class="metric-label">総合スコア</div>
                            <div class="metric-value" th:text="${#numbers.formatDecimal(factBasedEvaluation.totalScore, 1, 1)}">0</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">遅刻回数</div>
                            <div class="metric-value" th:text="${factBasedEvaluation.lateCount}">0</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">申請遵守率</div>
                            <div class="metric-value" th:text="${#numbers.formatDecimal(factBasedEvaluation.applicationComplianceRate, 1, 1) + '%'}">0%</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">打刻修正回数</div>
                            <div class="metric-value" th:text="${factBasedEvaluation.fixRequestCount}">0</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">連続勤務日数</div>
                            <div class="metric-value" th:text="${factBasedEvaluation.consecutiveWorkDays}">0</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">残業申請の正確性</div>
                            <div class="metric-value" th:text="${#numbers.formatDecimal(factBasedEvaluation.overtimeAccuracy, 1, 1) + '%'}">0%</div>
                        </div>
                    </div>
                </div>
                <div th:if="${factBasedEvaluation == null}">
                    <p style="color: #999;">今月の評価データはまだありません</p>
                </div>
            </section>

            <!-- 時系列可視化 -->
            <section class="card">
                <h2>📈 月別スコア推移</h2>
                <div th:if="${trendAnalysis != null}">
                    <p><strong>トレンド分析:</strong> <span th:text="${trendAnalysis}"></span></p>
                </div>
                <div class="trend-chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </section>

            <!-- 自己評価と管理者評価の比較 -->
            <section class="card">
                <h2>⚖️ 評価比較</h2>
                <div class="rating-comparison">
                    <div class="rating-card">
                        <h3>自己評価</h3>
                        <div th:if="${selfEvaluation != null}">
                            <span th:switch="${selfEvaluation.rating}" class="rating-badge">
                                <span th:case="'S'" class="rating-s">S</span>
                                <span th:case="'A'" class="rating-a">A</span>
                                <span th:case="'B'" class="rating-b">B</span>
                                <span th:case="'C'" class="rating-c">C</span>
                                <span th:case="'D'" class="rating-d">D</span>
                            </span>
                            <p th:if="${selfEvaluation.comment != null}" style="margin-top: 10px; color: #666;" th:text="${selfEvaluation.comment}"></p>
                        </div>
                        <div th:if="${selfEvaluation == null}">
                            <p style="color: #999;">自己評価が未入力です</p>
                        </div>
                    </div>
                    <div class="rating-card">
                        <h3>管理者評価</h3>
                        <div th:if="${trends != null and !trends.isEmpty() and trends[0].adminRating != null}">
                            <span th:switch="${trends[0].adminRating}" class="rating-badge">
                                <span th:case="'S'" class="rating-s">S</span>
                                <span th:case="'A'" class="rating-a">A</span>
                                <span th:case="'B'" class="rating-b">B</span>
                                <span th:case="'C'" class="rating-c">C</span>
                                <span th:case="'D'" class="rating-d">D</span>
                            </span>
                        </div>
                        <div th:if="${trends == null or trends.isEmpty() or trends[0].adminRating == null}">
                            <p style="color: #999;">管理者評価がまだありません</p>
                        </div>
                    </div>
                </div>
                <div th:if="${selfEvaluation != null and trends != null and !trends.isEmpty() and trends[0].adminRating != null and selfEvaluation.rating != trends[0].adminRating}">
                    <div class="difference-badge">
                        評価に差分があります: <span th:text="${selfEvaluation.rating + ' → ' + trends[0].adminRating}"></span>
                    </div>
                </div>
            </section>

            <!-- 自己評価入力フォーム -->
            <section class="card">
                <h2>✍️ 自己評価を入力</h2>
                <form th:action="@{/evaluation/self}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="yearMonth" th:value="${currentMonth.toString()}">
                    
                    <div class="form-group">
                        <label>評価:</label>
                        <div class="rating-buttons" style="display: flex; gap: 10px; margin-top: 10px;">
                            <button type="button" class="rating-btn rating-s" data-rating="S">S</button>
                            <button type="button" class="rating-btn rating-a" data-rating="A">A</button>
                            <button type="button" class="rating-btn rating-b" data-rating="B">B</button>
                            <button type="button" class="rating-btn rating-c" data-rating="C">C</button>
                            <button type="button" class="rating-btn rating-d" data-rating="D">D</button>
                        </div>
                        <input type="hidden" id="rating" name="rating" th:value="${selfEvaluation != null ? selfEvaluation.rating : 'B'}">
                    </div>
                    
                    <div class="form-group">
                        <label for="comment">コメント:</label>
                        <textarea id="comment" name="comment" class="form-control" rows="4" th:text="${selfEvaluation != null and selfEvaluation.comment != null ? selfEvaluation.comment : ''}"></textarea>
                    </div>
                    
                    <button type="submit" class="btn-primary">保存</button>
                </form>
            </section>
        </div>
    </div>

    <script>
        // 評価ボタンの選択
        document.querySelectorAll('.rating-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.rating-btn').forEach(function(b) {
                    b.classList.remove('selected');
                });
                this.classList.add('selected');
                document.getElementById('rating').value = this.getAttribute('data-rating');
            });
        });

        // 既存の評価を選択状態にする
        const currentRating = document.getElementById('rating').value;
        if (currentRating) {
            const btn = document.querySelector('.rating-btn[data-rating="' + currentRating + '"]');
            if (btn) {
                btn.classList.add('selected');
            }
        }

        // チャートの描画
        const trends = /*[[${trends}]]*/ [];
        if (trends && trends.length > 0) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            const labels = trends.map(t => {
                const date = new Date(t.yearMonth);
                return date.getFullYear() + '/' + (date.getMonth() + 1);
            }).reverse();
            const scores = trends.map(t => t.totalScore ? t.totalScore : 0).reverse();

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '総合スコア',
                        data: scores,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
