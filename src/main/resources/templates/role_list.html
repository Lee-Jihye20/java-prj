<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロール管理 - 勤怠管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .permission-group {
            margin-bottom: 20px;
        }
        .permission-group h4 {
            margin-bottom: 10px;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        .permission-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 5px;
            background-color: #f8f9fa;
            border-radius: 4px;
            gap: 10px;
        }
        .permission-item input[type="checkbox"] {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .permission-item label {
            flex: 1;
            cursor: pointer;
            text-align: left;
            margin: 0;
        }
        .permission-item label strong {
            display: block;
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
        }
        .permission-item label span {
            display: block;
            text-align: left;
        }
        .role-form {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .role-item {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }
        .role-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .role-permissions {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }
        .permission-badge {
            background-color: #e3f2fd;
            color: #1976d2;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ロール管理</h1>
            <div class="user-info">
                <span th:text="${username}">管理者</span>
                <a th:href="@{/admin/users}" class="btn-secondary" style="margin-left: 10px;">ユーザー一覧に戻る</a>
                <a th:href="@{/admin/dashboard}" class="btn-secondary" style="margin-left: 10px;">ダッシュボードに戻る</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-secondary" style="margin-left: 10px;">ログアウト</button>
                </form>
            </div>
        </header>

        <div th:if="${successMessage}" class="success-message">
            <p th:text="${successMessage}">処理が完了しました</p>
        </div>

        <div th:if="${errorMessage}" class="error-message">
            <p th:text="${errorMessage}">エラーが発生しました</p>
        </div>

        <div class="content" style="position: relative; padding-bottom: 80px;">
            <!-- 既存ロール一覧 -->
            <section class="card">
                <h2>既存ロール一覧</h2>
                <div th:if="${roles.isEmpty()}">
                    <p style="color: #999;">ロールがありません</p>
                </div>
                <div th:each="role : ${roles}" class="role-item">
                    <div class="role-header">
                        <div>
                            <h3 style="margin: 0; display: inline;" th:text="${role.name}"></h3>
                            <span th:if="${role.isSystemRole}" 
                                  style="display: inline-block; font-size: 0.8em; color: #999; margin-left: 10px;">(システムロール)</span>
                        </div>
                        <div th:if="${!role.isSystemRole}">
                            <!-- 権限IDを隠し要素として保持 -->
                            <span th:if="${role.permissions != null and !role.permissions.isEmpty()}" 
                                  th:each="perm, iterStat : ${role.permissions}"
                                  th:attr="data-role-${role.id}-perm=${perm.id}"
                                  style="display: none;"></span>
                            <button type="button" 
                                    class="btn-secondary edit-role-btn" 
                                    th:data-role-id="${role.id}"
                                    th:data-role-name="${role.name}"
                                    th:data-role-description="${role.description != null ? role.description : ''}"
                                    style="padding: 5px 15px; margin-right: 5px;">編集</button>
                            <form th:action="@{/admin/roles/{roleId}/delete(roleId=${role.id})}" 
                                  method="post" 
                                  style="display: inline;"
                                  onsubmit="return confirm('このロールを削除しますか？');">
                                <button type="submit" class="btn-secondary" style="padding: 5px 15px; background-color: #e74c3c; color: white;">削除</button>
                            </form>
                        </div>
                    </div>
                    <p th:if="${role.description}" style="color: #666; margin: 5px 0;" th:text="${role.description}"></p>
                    <div class="role-permissions">
                        <span th:if="${role.permissions == null or role.permissions.isEmpty()}" style="color: #999;">権限なし</span>
                        <span th:each="permission : ${role.permissions}" 
                              class="permission-badge"
                              th:text="${permission.name}"></span>
                    </div>
                </div>
            </section>
        </div>

        <!-- 新規作成ボタン（右下固定） -->
        <button id="createRoleBtn" class="btn-primary" style="position: fixed; bottom: 30px; right: 30px; padding: 15px 30px; font-size: 16px; border-radius: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 999; border: none; cursor: pointer;">
            ➕ 新規ロール作成
        </button>
    </div>

    <!-- 新規ロール作成モーダル -->
    <div id="createRoleModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 8px; min-width: 500px; max-width: 700px; max-height: 90vh; overflow-y: visible; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column;">
            <h2 style="margin-top: 0; flex-shrink: 0;">新規ロール作成</h2>
            <form id="createRoleForm" th:action="@{/admin/roles/create}" method="post" style="display: flex; flex-direction: column; gap: 15px; flex: 1; overflow: hidden;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-group" style="flex-shrink: 0;">
                    <label for="roleName">ロール名 <span style="color: red;">*</span>:</label>
                    <input type="text" id="roleName" name="name" class="form-control" required 
                           placeholder="例: データエクスポート担当" maxlength="50">
                </div>
                <div class="form-group" style="flex-shrink: 0;">
                    <label for="roleDescription">説明:</label>
                    <textarea id="roleDescription" name="description" class="form-control" rows="2" 
                              placeholder="ロールの説明を入力"></textarea>
                </div>
                <div class="form-group" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                    <label style="flex-shrink: 0;">権限を選択:</label>
                    <div style="flex: 1; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 4px; min-height: 0;">
                        <div th:each="categoryEntry : ${permissionsByCategory}" class="permission-group">
                            <h4 th:text="${categoryEntry.key}"></h4>
                            <div th:each="permission : ${categoryEntry.value}"
                                 class="permission-item">
                                <label th:for="'create_perm_' + ${permission.id}" style="flex: 1; text-align: left;">
                                    <strong th:text="${permission.name}" style="display: block; text-align: left;"></strong>
                                    <span th:if="${permission.description}" 
                                          style="display: block; font-size: 0.85em; color: #666; margin-top: 2px; text-align: left;"
                                          th:text="${permission.description}"></span>
                                </label>
                                <input type="checkbox" 
                                       th:id="'create_perm_' + ${permission.id}"
                                       th:name="permissionIds" 
                                       th:value="${permission.id}"
                                       style="flex-shrink: 0; margin-left: 10px;">
                            </div>
                        </div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; flex-shrink: 0; margin-top: 10px;">
                    <button type="button" onclick="closeCreateRoleModal()" class="btn-secondary" style="padding: 8px 20px;">キャンセル</button>
                    <button type="submit" class="btn-primary" style="padding: 8px 20px;">作成</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ロール編集モーダル -->
    <div id="editRoleModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 8px; min-width: 500px; max-width: 700px; max-height: 90vh; overflow-y: visible; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column;">
            <h2 style="margin-top: 0; flex-shrink: 0;">ロール編集</h2>
            <form id="editRoleForm" method="post" style="display: flex; flex-direction: column; gap: 15px; flex: 1; overflow: hidden;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" id="editRoleId" name="roleId">
                <div class="form-group" style="flex-shrink: 0;">
                    <label for="editRoleName">ロール名 <span style="color: red;">*</span>:</label>
                    <input type="text" id="editRoleName" name="name" class="form-control" required maxlength="50">
                </div>
                <div class="form-group" style="flex-shrink: 0;">
                    <label for="editRoleDescription">説明:</label>
                    <textarea id="editRoleDescription" name="description" class="form-control" rows="2"></textarea>
                </div>
                <div class="form-group" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                    <label style="flex-shrink: 0;">権限を選択:</label>
                    <div style="flex: 1; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 4px; min-height: 0;">
                        <div th:each="categoryEntry : ${permissionsByCategory}" class="permission-group">
                            <h4 th:text="${categoryEntry.key}"></h4>
                            <div th:each="permission : ${categoryEntry.value}"
                                 class="permission-item">
                                <label th:for="'edit_perm_' + ${permission.id}" style="flex: 1; text-align: left;">
                                    <strong th:text="${permission.name}" style="display: block; text-align: left;"></strong>
                                    <span th:if="${permission.description}" 
                                          style="display: block; font-size: 0.85em; color: #666; margin-top: 2px; text-align: left;"
                                          th:text="${permission.description}"></span>
                                </label>
                                <input type="checkbox" 
                                       th:id="'edit_perm_' + ${permission.id}"
                                       th:name="permissionIds" 
                                       th:value="${permission.id}"
                                       class="edit-permission-checkbox"
                                       style="flex-shrink: 0; margin-left: 10px;">
                            </div>
                        </div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; flex-shrink: 0; margin-top: 10px;">
                    <button type="button" onclick="closeEditRoleModal()" class="btn-secondary" style="padding: 8px 20px;">キャンセル</button>
                    <button type="submit" class="btn-primary" style="padding: 8px 20px;">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 新規作成ボタン
            const createRoleBtn = document.getElementById('createRoleBtn');
            if (createRoleBtn) {
                createRoleBtn.addEventListener('click', function() {
                    showCreateRoleModal();
                });
            }

            // 編集ボタン（イベント委譲）
            document.addEventListener('click', function(e) {
                const button = e.target.closest('.edit-role-btn');
                if (button) {
                    e.preventDefault();
                    e.stopPropagation();
                    const roleId = button.getAttribute('data-role-id');
                    const roleName = button.getAttribute('data-role-name');
                    const roleDescription = button.getAttribute('data-role-description') || '';
                    
                    // 権限IDを収集
                    const permissionElements = document.querySelectorAll('[data-role-' + roleId + '-perm]');
                    const rolePermissionIds = Array.from(permissionElements)
                        .map(el => el.getAttribute('data-role-' + roleId + '-perm'))
                        .join(',');
                    
                    showEditRoleModal(roleId, roleName, roleDescription, rolePermissionIds);
                }
            });
        });

        function showCreateRoleModal() {
            // フォームをリセット
            document.getElementById('createRoleForm').reset();
            document.getElementById('createRoleModal').style.display = 'block';
        }

        function closeCreateRoleModal() {
            document.getElementById('createRoleModal').style.display = 'none';
        }

        function showEditRoleModal(roleId, roleName, roleDescription, rolePermissionIds) {
            document.getElementById('editRoleId').value = roleId;
            document.getElementById('editRoleName').value = roleName || '';
            document.getElementById('editRoleDescription').value = roleDescription || '';
            
            // 既存のチェックボックスをすべてクリア
            const checkboxes = document.querySelectorAll('.edit-permission-checkbox');
            checkboxes.forEach(function(cb) {
                cb.checked = false;
            });
            
            // ロールの権限をチェックボックスに反映
            if (rolePermissionIds && rolePermissionIds.trim() !== '') {
                const permissionIdArray = rolePermissionIds.split(',').map(id => id.trim());
                permissionIdArray.forEach(function(permissionId) {
                    const checkbox = document.querySelector('#edit_perm_' + permissionId);
                    if (checkbox) {
                        checkbox.checked = true;
                    }
                });
            }
            
            document.getElementById('editRoleModal').style.display = 'block';
            
            // フォームのactionを設定
            const form = document.getElementById('editRoleForm');
            form.action = '/admin/roles/' + roleId + '/update';
        }

        function closeEditRoleModal() {
            document.getElementById('editRoleModal').style.display = 'none';
        }

        // モーダル背景クリックで閉じる
        document.getElementById('createRoleModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeCreateRoleModal();
            }
        });

        document.getElementById('editRoleModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditRoleModal();
            }
        });
    </script>
</body>
</html>
