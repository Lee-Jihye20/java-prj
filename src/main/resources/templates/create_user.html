<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社員アカウント作成 - 勤怠管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>社員アカウント作成</h1>
            <div class="user-info">
                <span th:text="${username}">管理者</span>
                <a th:href="@{/admin/users}" class="btn-secondary" style="margin-left: 10px;">社員一覧に戻る</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-secondary" style="margin-left: 10px;">ログアウト</button>
                </form>
            </div>
        </header>

        <div th:if="${successMessage}" class="success-message">
            <p th:text="${successMessage}">アカウントが作成されました</p>
        </div>

        <div th:if="${errorMessage}" class="error-message">
            <p th:text="${errorMessage}">エラーが発生しました</p>
        </div>

        <div class="content">
            <section class="card">
                <h2>新規社員アカウント作成</h2>
                <div style="background-color: #e3f2fd; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
                    <strong>企業コード:</strong> <span th:text="${companyCode}"></span>
                    <p style="margin: 5px 0 0 0; font-size: 0.9em; color: #666;">
                        作成したアカウントでログインする際は、この企業コードが必要です。
                    </p>
                </div>
                <form th:action="@{/admin/users/create}" method="post">
                    <div class="form-group">
                        <label for="username">ユーザー名 <span style="color: red;">*</span>:</label>
                        <input type="text" id="username" name="username" class="form-control" required 
                               placeholder="ユーザー名を入力" maxlength="50">
                        <small style="color: #666;">同じ企業内で一意である必要があります</small>
                    </div>

                    <div class="form-group">
                        <label for="password">パスワード <span style="color: red;">*</span>:</label>
                        <input type="password" id="password" name="password" class="form-control" required 
                               placeholder="パスワードを入力">
                    </div>

                    <div class="form-group">
                        <label for="role">権限 <span style="color: red;">*</span>:</label>
                        <select id="role" name="role" class="form-control" required>
                            <option value="EMPLOYEE" selected>従業員</option>
                            <option value="ADMIN">管理者</option>
                        </select>
                        <small style="color: #666;">管理者は全機能にアクセスできます</small>
                    </div>

                    <div class="form-group">
                        <label for="slackWebhookUrl">Slack Webhook URL:</label>
                        <input type="url" id="slackWebhookUrl" name="slackWebhookUrl" class="form-control" 
                               placeholder="https://hooks.slack.com/services/...">
                        <small style="color: #666;">オプション: Slack通知用のWebhook URL</small>
                    </div>

                    <div class="form-group">
                        <label for="slackUserId">Slack User ID:</label>
                        <input type="text" id="slackUserId" name="slackUserId" class="form-control" 
                               placeholder="U0A1J4TTR43">
                        <small style="color: #666;">オプション: Slackでのメンション用のUser ID</small>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn-primary">アカウントを作成</button>
                        <a th:href="@{/admin/users}" class="btn-secondary" style="margin-left: 10px;">キャンセル</a>
                    </div>
                </form>
            </section>
        </div>
    </div>
</body>
</html>
