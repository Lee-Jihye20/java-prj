<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>異常検知 - 勤怠管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>異常検知</h1>
            <div class="user-info">
                <span th:text="${username}">管理者</span>
                <a th:href="@{/admin/dashboard}" class="btn-secondary" style="margin-left: 10px;">ダッシュボードに戻る</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-secondary" style="margin-left: 10px;">ログアウト</button>
                </form>
            </div>
        </header>

        <div class="content">
            <section class="card">
                <h2>残業検知（実働9時間超過）</h2>
                <div class="table-wrapper">
                    <table class="attendance-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>ユーザー名</th>
                                <th>出勤</th>
                                <th>退勤</th>
                                <th>休憩開始</th>
                                <th>休憩終了</th>
                                <th>状態</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="attendance : ${overtimeList}">
                                <td th:text="${attendance.id}"></td>
                                <td><strong th:text="${userMap.get(attendance.userId)}"></strong></td>
                                <td th:text="${#temporals.format(attendance.checkIn, 'yyyy-MM-dd HH:mm')}"></td>
                                <td th:text="${#temporals.format(attendance.checkOut, 'yyyy-MM-dd HH:mm')}"></td>
                                <td th:text="${attendance.breakStart != null ? #temporals.format(attendance.breakStart, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                                <td th:text="${attendance.breakEnd != null ? #temporals.format(attendance.breakEnd, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                                <td>
                                    <span th:if="${anomalyApprovalMap != null and anomalyApprovalMap.get(attendance.id) != null and anomalyApprovalMap.get(attendance.id).approved == true}"
                                          style="background-color: #27ae60; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em;">
                                        承認済み
                                    </span>
                                    <span th:if="${anomalyApprovalMap == null or anomalyApprovalMap.get(attendance.id) == null or anomalyApprovalMap.get(attendance.id).approved == false}"
                                          style="background-color: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em;">
                                        未承認
                                    </span>
                                </td>
                                <td>
                                    <button type="button" 
                                            class="btn-primary anomaly-approval-btn" 
                                            style="padding: 5px 10px; font-size: 0.9em;"
                                            th:data-attendance-id="${attendance.id}"
                                            th:data-user-id="${attendance.userId}"
                                            th:data-anomaly-type="OVERTIME">
                                        理由・承認・補正
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(overtimeList)}">
                                <td colspan="8" style="text-align: center;">該当データなし</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="card">
                <h2>打刻漏れ検知 (退勤未打刻)</h2>
                <div class="table-wrapper">
                    <table class="attendance-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>ユーザー名</th>
                                <th>出勤</th>
                                <th>休憩開始</th>
                                <th>休憩終了</th>
                                <th>状態</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="attendance : ${missingCheckoutList}">
                                <td th:text="${attendance.id}"></td>
                                <td><strong th:text="${userMap.get(attendance.userId)}"></strong></td>
                                <td th:text="${#temporals.format(attendance.checkIn, 'yyyy-MM-dd HH:mm')}"></td>
                                <td th:text="${attendance.breakStart != null ? #temporals.format(attendance.breakStart, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                                <td th:text="${attendance.breakEnd != null ? #temporals.format(attendance.breakEnd, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                                <td>
                                    <span th:if="${anomalyApprovalMap != null and anomalyApprovalMap.get(attendance.id) != null and anomalyApprovalMap.get(attendance.id).approved == true}"
                                          style="background-color: #27ae60; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em;">
                                        承認済み
                                    </span>
                                    <span th:if="${anomalyApprovalMap == null or anomalyApprovalMap.get(attendance.id) == null or anomalyApprovalMap.get(attendance.id).approved == false}"
                                          style="background-color: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em;">
                                        未承認
                                    </span>
                                </td>
                                <td>
                                    <button type="button" 
                                            class="btn-primary anomaly-approval-btn" 
                                            style="padding: 5px 10px; font-size: 0.9em;"
                                            th:data-attendance-id="${attendance.id}"
                                            th:data-user-id="${attendance.userId}"
                                            th:data-anomaly-type="MISSING_CHECKOUT">
                                        理由・承認・補正
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(missingCheckoutList)}">
                                <td colspan="7" style="text-align: center;">該当データなし</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <!-- 理由・承認・補正モーダル -->
    <div id="anomalyApprovalModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 8px; min-width: 500px; max-width: 700px; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h2 style="margin-top: 0;">理由・承認・補正</h2>
            <p>ユーザー: <strong id="approvalUsername"></strong></p>
            <p>異常タイプ: <strong id="approvalAnomalyType"></strong></p>
            
            <form id="anomalyApprovalForm" method="post" th:action="@{/admin/anomaly/approval}" style="display: flex; flex-direction: column; gap: 20px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" id="approvalAttendanceId" name="attendanceId">
                <input type="hidden" id="approvalUserId" name="userId">
                <input type="hidden" id="approvalAnomalyTypeValue" name="anomalyType">
                
                <div class="form-group">
                    <label for="approvalReason">理由:</label>
                    <textarea id="approvalReason" 
                              name="reason" 
                              class="form-control" 
                              rows="4" 
                              placeholder="異常が発生した理由を入力してください（例：緊急対応、プロジェクト納期など）"
                              required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="approvalApproved">承認:</label>
                    <select id="approvalApproved" name="approved" class="form-control" required>
                        <option value="true">承認する</option>
                        <option value="false">承認しない</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="approvalAdjustmentHours">補正時間（時間単位）:</label>
                    <input type="number" 
                           id="approvalAdjustmentHours" 
                           name="adjustmentHours" 
                           class="form-control"
                           step="0.25"
                           placeholder="例: -1.5（1.5時間減算）、1.0（1時間加算）"
                           style="margin-bottom: 5px;">
                    <small style="color: #666; font-size: 0.85em;">負の値で減算、正の値で加算。未入力の場合は補正なし。</small>
                </div>
                
                <div class="form-group">
                    <label for="approvalAdjustmentReason">補正理由:</label>
                    <textarea id="approvalAdjustmentReason" 
                              name="adjustmentReason" 
                              class="form-control" 
                              rows="3" 
                              placeholder="補正を行う理由を入力してください（補正時間を入力した場合のみ）"></textarea>
                </div>
                
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
                    <button type="button" onclick="closeAnomalyApprovalModal()" class="btn-secondary" style="padding: 8px 20px;">キャンセル</button>
                    <button type="submit" class="btn-primary" style="padding: 8px 20px;">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        // ユーザー名マップを取得
        const userMap = /*[[${userMap}]]*/ {};
        const anomalyApprovalMap = /*[[${anomalyApprovalMap}]]*/ {};
        
        // 理由・承認・補正ボタンのクリックイベント（イベント委譲）
        document.addEventListener('click', function(e) {
            const approvalBtn = e.target.closest('.anomaly-approval-btn');
            if (approvalBtn) {
                e.preventDefault();
                e.stopPropagation();
                
                const attendanceId = approvalBtn.getAttribute('data-attendance-id');
                const userId = approvalBtn.getAttribute('data-user-id');
                const anomalyType = approvalBtn.getAttribute('data-anomaly-type');
                
                showAnomalyApprovalModal(attendanceId, userId, anomalyType);
            }
        });
        
        function showAnomalyApprovalModal(attendanceId, userId, anomalyType) {
            const modal = document.getElementById('anomalyApprovalModal');
            const attendanceIdInput = document.getElementById('approvalAttendanceId');
            const userIdInput = document.getElementById('approvalUserId');
            const usernameElement = document.getElementById('approvalUsername');
            const anomalyTypeElement = document.getElementById('approvalAnomalyType');
            const anomalyTypeValueInput = document.getElementById('approvalAnomalyTypeValue');
            const reasonTextarea = document.getElementById('approvalReason');
            const approvedSelect = document.getElementById('approvalApproved');
            const adjustmentHoursInput = document.getElementById('approvalAdjustmentHours');
            const adjustmentReasonTextarea = document.getElementById('approvalAdjustmentReason');
            
            if (!modal || !attendanceIdInput || !userIdInput || !usernameElement || !anomalyTypeElement || !anomalyTypeValueInput) {
                console.error('Modal elements not found');
                return;
            }
            
            // ユーザー名を取得
            const username = userMap[userId] || 'ユーザーID: ' + userId;
            
            attendanceIdInput.value = attendanceId;
            userIdInput.value = userId;
            usernameElement.textContent = username;
            anomalyTypeValueInput.value = anomalyType;
            
            // 異常タイプに応じて表示を設定
            if (anomalyType === 'OVERTIME') {
                anomalyTypeElement.textContent = '残業超過';
            } else if (anomalyType === 'MISSING_CHECKOUT') {
                anomalyTypeElement.textContent = '打刻漏れ';
            } else if (anomalyType === 'LATE') {
                anomalyTypeElement.textContent = '遅刻';
            }
            
            // 既存の承認情報がある場合は表示
            const existingApproval = anomalyApprovalMap && anomalyApprovalMap[attendanceId];
            if (existingApproval) {
                reasonTextarea.value = existingApproval.reason || '';
                approvedSelect.value = existingApproval.approved ? 'true' : 'false';
                adjustmentHoursInput.value = existingApproval.adjustmentHours || '';
                adjustmentReasonTextarea.value = existingApproval.adjustmentReason || '';
            } else {
                // フォームをリセット
                reasonTextarea.value = '';
                approvedSelect.value = 'false';
                adjustmentHoursInput.value = '';
                adjustmentReasonTextarea.value = '';
            }
            
            modal.style.display = 'block';
        }
        
        function closeAnomalyApprovalModal() {
            document.getElementById('anomalyApprovalModal').style.display = 'none';
        }
        
        // モーダル外をクリックで閉じる
        const anomalyApprovalModal = document.getElementById('anomalyApprovalModal');
        if (anomalyApprovalModal) {
            anomalyApprovalModal.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeAnomalyApprovalModal();
                }
            });
        }
    </script>
</body>
</html>
