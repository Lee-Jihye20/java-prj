<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月別評価一覧 - 勤怠管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .evaluation-summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .evaluation-summary-table th,
        .evaluation-summary-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .evaluation-summary-table th {
            background-color: #f5f5f5;
            font-weight: 600;
        }
        .evaluation-summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .rating-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .rating-s { background-color: #ffeb3b; color: #333; }
        .rating-a { background-color: #ff9800; color: white; }
        .rating-b { background-color: #2196f3; color: white; }
        .rating-c { background-color: #9e9e9e; color: white; }
        .rating-d { background-color: #424242; color: white; }
        .rating-none { background-color: #e0e0e0; color: #666; }
        .week-details {
            margin-top: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .week-detail-item {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .week-detail-item:last-child {
            border-bottom: none;
        }
        .month-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .month-selector select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }
        .evaluation-count {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>月別評価一覧</h1>
            <div class="user-info">
                <span th:text="${username}">管理者</span>
                <a th:href="@{/admin/dashboard}" class="btn-secondary" style="margin-left: 10px;">管理画面へ</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn-secondary" style="margin-left: 10px;">ログアウト</button>
                </form>
            </div>
        </header>

        <div th:if="${successMessage}" class="success-message">
            <p th:text="${successMessage}">成功しました</p>
        </div>
        <div th:if="${errorMessage}" class="error-message">
            <p th:text="${errorMessage}">エラーが発生しました</p>
        </div>

        <div class="dashboard-content">
            <section class="card">
                <h2>月別評価サマリー</h2>
                <div class="month-selector">
                    <label for="yearMonthSelect" style="font-weight: 600;">評価する月を選択:</label>
                    <select id="yearMonthSelect" class="form-control">
                        <option th:each="month : ${availableMonths}" 
                                th:value="${month.toString()}"
                                th:text="${#temporals.format(month.atDay(1), 'yyyy年MM月')}"
                                th:selected="${month.equals(selectedYearMonth)}"></option>
                    </select>
                    <span style="font-weight: 600;" th:text="${#temporals.format(selectedYearMonth.atDay(1), 'yyyy年MM月')}"></span>
                </div>
                
                <div style="margin-bottom: 20px; padding: 15px; background-color: #f8f9fa; border-radius: 5px;">
                    <form method="get" th:action="@{/admin/evaluations/monthly}" style="display: flex; gap: 10px; align-items: center;">
                        <input type="hidden" name="yearMonth" th:value="${selectedYearMonthStr}">
                        <label for="searchInput" style="font-weight: 600; white-space: nowrap;">名前で検索:</label>
                        <input type="text" 
                               id="searchInput" 
                               name="search" 
                               th:value="${search}"
                               placeholder="社員名を入力..."
                               style="flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                        <button type="submit" class="btn-primary" style="padding: 8px 20px;">検索</button>
                        <a th:if="${search != null and !search.isEmpty()}" 
                           th:href="@{/admin/evaluations/monthly(yearMonth=${selectedYearMonthStr})}" 
                           class="btn-secondary" 
                           style="padding: 8px 20px;">クリア</a>
                    </form>
                </div>

                <div th:if="${evaluations == null or evaluations.isEmpty()}">
                    <p style="color: #999; padding: 20px;">この月の評価データはありません。評価は自動計算されます。</p>
                </div>

                <table th:if="${evaluations != null and !evaluations.isEmpty()}" class="evaluation-summary-table">
                    <thead>
                        <tr>
                            <th>従業員名</th>
                            <th>総合スコア</th>
                            <th>遅刻回数</th>
                            <th>申請遵守率</th>
                            <th>打刻修正回数</th>
                            <th>連続勤務日数</th>
                            <th>残業申請の正確性</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="eval : ${evaluations}">
                            <td>
                                <strong th:text="${eval.employee.username}"></strong>
                            </td>
                            <td>
                                <span class="rating-badge" style="background-color: #667eea; color: white;">
                                    <span th:text="${#numbers.formatDecimal(eval.totalScore, 1, 1)}"></span>
                                </span>
                            </td>
                            <td th:text="${eval.lateCount}">0</td>
                            <td th:text="${#numbers.formatDecimal(eval.applicationComplianceRate, 1, 1) + '%'}">0%</td>
                            <td th:text="${eval.fixRequestCount}">0</td>
                            <td th:text="${eval.consecutiveWorkDays}">0</td>
                            <td th:text="${#numbers.formatDecimal(eval.overtimeAccuracy, 1, 1) + '%'}">0%</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const yearMonthSelect = document.getElementById('yearMonthSelect');
            const searchInput = document.getElementById('searchInput');
            
            if (yearMonthSelect) {
                yearMonthSelect.addEventListener('change', function() {
                    const selectedYearMonth = this.value;
                    const searchValue = searchInput ? searchInput.value : '';
                    if (selectedYearMonth) {
                        let url = '/admin/evaluations/monthly?yearMonth=' + encodeURIComponent(selectedYearMonth);
                        if (searchValue) {
                            url += '&search=' + encodeURIComponent(searchValue);
                        }
                        window.location.href = url;
                    }
                });
            }
        });
    </script>
</body>
</html>
