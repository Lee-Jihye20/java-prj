<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月別評価一覧 - 勤怠管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .evaluation-summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .evaluation-summary-table th,
        .evaluation-summary-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .evaluation-summary-table th {
            background-color: #f5f5f5;
            font-weight: 600;
        }
        .evaluation-summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .rating-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .rating-s { background-color: #ffeb3b; color: #333; }
        .rating-a { background-color: #ff9800; color: white; }
        .rating-b { background-color: #2196f3; color: white; }
        .rating-c { background-color: #9e9e9e; color: white; }
        .rating-d { background-color: #424242; color: white; }
        .rating-none { background-color: #e0e0e0; color: #666; }
        .week-details {
            margin-top: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .week-detail-item {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .week-detail-item:last-child {
            border-bottom: none;
        }
        .month-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .month-selector select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }
        .evaluation-count {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>月別評価一覧</h1>
            <div class="user-info">
                <span th:text="${username}">管理者</span>
                <a th:href="@{/admin/dashboard}" class="btn-secondary" style="margin-left: 10px;">管理画面へ</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn-secondary" style="margin-left: 10px;">ログアウト</button>
                </form>
            </div>
        </header>

        <div th:if="${successMessage}" class="success-message">
            <p th:text="${successMessage}">成功しました</p>
        </div>
        <div th:if="${errorMessage}" class="error-message">
            <p th:text="${errorMessage}">エラーが発生しました</p>
        </div>

        <div class="dashboard-content">
            <section class="card">
                <h2>月別評価サマリー</h2>
                <div class="month-selector">
                    <label for="yearMonthSelect" style="font-weight: 600;">評価する月を選択:</label>
                    <select id="yearMonthSelect" class="form-control">
                        <option th:each="month : ${availableMonths}" 
                                th:value="${month.toString()}"
                                th:text="${#temporals.format(month.atDay(1), 'yyyy年MM月')}"
                                th:selected="${month.equals(selectedYearMonth)}"></option>
                    </select>
                    <span style="font-weight: 600;" th:text="${#temporals.format(selectedYearMonth.atDay(1), 'yyyy年MM月')}"></span>
                </div>

                <div th:if="${summaries.isEmpty()}">
                    <p style="color: #999; padding: 20px;">この月の評価データはありません</p>
                </div>

                <table th:if="${!summaries.isEmpty()}" class="evaluation-summary-table">
                    <thead>
                        <tr>
                            <th>従業員名</th>
                            <th>平均評価</th>
                            <th>評価数</th>
                            <th>週別評価詳細</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="summary : ${summaries}">
                            <td>
                                <strong th:text="${summary.employeeName}"></strong>
                            </td>
                            <td>
                                <span th:switch="${summary.averageRatingLabel}" class="rating-badge">
                                    <span th:case="'S'" class="rating-s">S</span>
                                    <span th:case="'A'" class="rating-a">A</span>
                                    <span th:case="'B'" class="rating-b">B</span>
                                    <span th:case="'C'" class="rating-c">C</span>
                                    <span th:case="'D'" class="rating-d">D</span>
                                    <span th:case="*" class="rating-none">-</span>
                                </span>
                                <span th:if="${summary.evaluationCount > 0}" 
                                      style="margin-left: 10px; color: #666; font-size: 0.9em;"
                                      th:text="'(' + ${#numbers.formatDecimal(summary.averageRating, 1, 2)} + ')'"></span>
                            </td>
                            <td>
                                <span class="evaluation-count" th:text="${summary.evaluationCount} + '件'"></span>
                            </td>
                            <td>
                                <div class="week-details" th:if="${summary.weeklyEvaluations != null and !summary.weeklyEvaluations.isEmpty()}">
                                    <div th:each="weekly : ${summary.weeklyEvaluations}" class="week-detail-item">
                                        <div style="display: flex; justify-content: space-between; align-items: center;">
                                            <span style="font-size: 0.9em;">
                                                <span th:text="${#temporals.format(weekly.weekStartDate, 'MM/dd') + ' ～ ' + #temporals.format(weekly.weekEndDate, 'MM/dd')}"></span>
                                                <span th:if="${weekly.comment != null and !weekly.comment.isEmpty()}" 
                                                      style="margin-left: 10px; color: #666;"
                                                      th:text="${'(' + weekly.comment + ')'}"></span>
                                            </span>
                                            <span th:switch="${weekly.rating}" class="rating-badge" style="margin-left: 10px;">
                                                <span th:case="'S'" class="rating-s">S</span>
                                                <span th:case="'A'" class="rating-a">A</span>
                                                <span th:case="'B'" class="rating-b">B</span>
                                                <span th:case="'C'" class="rating-c">C</span>
                                                <span th:case="'D'" class="rating-d">D</span>
                                            </span>
                                        </div>
                                        <div style="font-size: 0.85em; color: #999; margin-top: 3px;">
                                            評価者: <span th:text="${weekly.evaluatorName}"></span>
                                        </div>
                                    </div>
                                </div>
                                <span th:if="${summary.weeklyEvaluations == null or summary.weeklyEvaluations.isEmpty()}" 
                                      style="color: #999;">評価なし</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const yearMonthSelect = document.getElementById('yearMonthSelect');
            if (yearMonthSelect) {
                yearMonthSelect.addEventListener('change', function() {
                    const selectedYearMonth = this.value;
                    if (selectedYearMonth) {
                        window.location.href = '/admin/evaluations/monthly?yearMonth=' + encodeURIComponent(selectedYearMonth);
                    }
                });
            }
        });
    </script>
</body>
</html>
